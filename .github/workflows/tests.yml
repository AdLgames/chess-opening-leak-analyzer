name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The accounts tests need a real database: the leak lifecycle is SQL, and
    # asserting it against a mock would assert the mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LEAKLAB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # pulls chessopening/data/openings.sqlite

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r chess_opening_analyzer/requirements.txt pytest \
            'psycopg[binary]' psycopg-pool fastapi httpx

      - name: Install Stockfish
        run: python chess_opening_analyzer/tools/install_stockfish.py

      - name: Verify the engine
        run: python chess_opening_analyzer/tools/install_stockfish.py --check

      - name: Run tests
        run: cd chess_opening_analyzer && python -m pytest tests -q

      - name: End-to-end CLI run
        run: |
          cd chess_opening_analyzer
          python -m chessopening --pgn-dir sample_pgns --db local \
            --min-db-games 20 --depth 10 --out-dir out
          head -2 out/opening_leaks.csv

      - uses: actions/upload-artifact@v4
        with:
          name: opening_leaks
          path: chess_opening_analyzer/out/opening_leaks.csv
